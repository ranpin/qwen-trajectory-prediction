# Qwen3-4B QLoRA training config for ms-swift 4.x
model: models/qwen/Qwen3-4B
tuner_type: lora
dataset: data/processed/synthetic_sft.jsonl
output_dir: outputs/qwen3-4b-synthetic-lora

# LoRA config
lora_rank: 16
lora_alpha: 32
target_modules: all-linear

# Training config
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1e-4
max_length: 2048
warmup_ratio: 0.05

# Quantization
quantization_bit: 4
torch_dtype: bfloat16

# Optimization
gradient_checkpointing: true
optim: paged_adamw_32bit

# Logging
logging_steps: 10
save_steps: 1000
